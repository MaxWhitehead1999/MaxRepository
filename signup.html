<!DOCTYPE html>
<html lang="en">
<head>
  <title>Signup</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div id = "signup">
    <h1>Signup</h1>

      <label class ="Signup">FirstName</label>
      <input type="text" id="FirstName" placeholder="FirstName" ><br><br>

      <label class="Signup">LastName</label>
      <input type="text" id="LastName" placeholder="LastName" ><br><br>

      <label class="Signup">Password</label>
      <input type="password" id="password" placeholder="password" ><br><br>
     
      <label class="Signup">Address</label>
      <input type="text" id="address" placeholder="Address" ><br><br>

      <label class="Signup">Email</label>
      <input type="text" id="email"  placeholder="Email"><br><br>

      <label class="Signup">Phone Number</label>
      <input type="text" id="phone"  placeholder="Phone Number"><br><br>
      
      <button id="signupBtn">Signup</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
