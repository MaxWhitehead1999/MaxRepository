<!DOCTYPE html>
<html lang="en">

<head>
  <title>Signup</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="inputContainer">
    <h1>Signup</h1>

    <form action="signup.php" method="POST">

      <input type="text" name="firstname" class="defaultInput" placeholder="FirstName"><br><br>

      <input type="text" name="lastname" class="defaultInput" id="lastName" placeholder="LastName"><br><br>

      <input type="password" name="password" class="defaultInput" id="password" placeholder="password"><br><br>

      <input type="text" name="address" class="defaultInput" id="address" placeholder="Address"><br><br>

      <input type="text" name="email" class="defaultInput" placeholder="Email"><br><br>

      <input type="text" name="phone" class="defaultInput" placeholder="Phone Number"><br><br>

      <div class="btnSignupContainer">
        <button type="submit" class="signupBtn" >Signup</button>
      </div>
    </form>

  </div>

  <script src="script.js"></script>
</body>

</html>
