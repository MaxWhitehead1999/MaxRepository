  <div class="inputContainer">
    <h1>Edit Profile</h1>

    <form id="editProfileForm">

      <input type="text" name="firstname" class="defaultInput"
             id="firstName" required><br><br>

      <input type="text" name="lastname" class="defaultInput"
             id="lastName" required><br><br>

      <input type="text" name="address" class="defaultInput"
             id="address" required><br><br>

      
      <div class="btnSignupContainer">
        <button type="submit" class="signupBtn">Save Changes</button>
      </div>

    </form>

  </div>
