<!DOCTYPE html>
<html lang="en">

<!--This html is used for adding a new book to the library database, librarian access only-->

<head>
    <title>Add New Book</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <nav class="menuRibbon">
        <ul>
            <li><a href="main.html">Home</a></li>
            <li><a href="search.html">SearchBook</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>


    <div class="inputContainer">
        <h1>Add New Book</h1>

        <p>Basic Info</p>

        <input type="text" class="defaultInput" placeholder="Title"><br><br>

        <input type="text" class="defaultInput" placeholder="Subtitle"><br><br>

        <input type="text" class="defaultInput" placeholder="Edition"><br><br>

        <input type="text" class="defaultInput" placeholder="Publishing Company"><br><br>

        <input type="text" class="defaultInput" placeholder="Publication Date"><br><br>

        <input type="text" class="defaultInput" placeholder="Phone Number"><br><br>

        <p>Classification Info</p>

        <input type="text" class="defaultInput" placeholder="ISBN"><br><br>

        <input type="text" class="defaultInput" placeholder="Dewey Decimal"><br><br>

        <input type="text" class="defaultInput" placeholder="Genre"><br><br>

        <input type="text" class="defaultInput" placeholder="Audience"><br><br>

        <input type="text" class="defaultInput" placeholder="# of Pages"><br><br>

        <p>Availability Info</p>

        <input type="text" class="defaultInput" placeholder="Available Copies"><br><br>

        <input type="text" class="defaultInput" placeholder="Due Date"><br><br>

        <div class="btnContainer">
            <button class="save">Save</button>

            <button class="cancel">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
